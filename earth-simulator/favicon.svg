<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ocean" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#6ccbff" />
      <stop offset="55%" stop-color="#1f86e6" />
      <stop offset="100%" stop-color="#0a347d" />
    </radialGradient>
    <linearGradient id="night" x1="0.15" y1="0.1" x2="1" y2="1">
      <stop offset="58%" stop-color="#02060f" stop-opacity="0" />
      <stop offset="100%" stop-color="#02060f" stop-opacity="0.6" />
    </linearGradient>
    <clipPath id="globe"><circle cx="32" cy="32" r="29" /></clipPath>
  </defs>

  <!-- atmosphere halo -->
  <circle cx="32" cy="32" r="31" fill="#7cc6ff" opacity="0.22" />

  <!-- ocean -->
  <circle cx="32" cy="32" r="29" fill="url(#ocean)" />

  <!-- stylised continents -->
  <g clip-path="url(#globe)" fill="#34b86c">
    <path d="M15 19c4-4 11-3 13 1 1 3-2 5 1 8 2 3 8 1 9 5 1 4-4 6-8 6-5-1-10-3-13-7-3-4-6-9-2-13z" />
    <path d="M37 39c4-2 10 0 11 4s-5 8-9 6c-4-1-6-8-2-10z" />
    <path d="M11 35c3-2 6 0 6 3s-4 6-7 4-2-6 1-7z" />
    <path d="M41 13c3-1 7 1 6 5-1 3-6 3-8 0-2-2 0-4 2-5z" />
  </g>

  <!-- day/night terminator -->
  <circle cx="32" cy="32" r="29" fill="url(#night)" />
  <!-- rim light -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#cfeaff" stroke-opacity="0.4" stroke-width="1" />
</svg>
